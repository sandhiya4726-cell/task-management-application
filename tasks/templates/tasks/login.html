{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - Task Management</title>
    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>
<body>
    <h1>Login to Your Account</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account?
        <a href="{% url 'register' %}">Register here</a>
    </p>
</body>
</html>
